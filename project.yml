name: Tornadobreak
options:
  bundleIdPrefix: com.angie689
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
packages:
  TornadoCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Tornadobreak:
    type: application
    platform: iOS
    sources: [Tornadobreak]
    dependencies:
      - package: TornadoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angie689.Tornadobreak
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tornadobreak
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  TornadobreakTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TornadobreakTests]
    dependencies:
      - target: Tornadobreak
      - package: TornadoCore
    settings:
      GENERATE_INFOPLIST_FILE: YES
  TornadobreakUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TornadobreakUITests]
    dependencies:
      - target: Tornadobreak
    settings:
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Tornadobreak:
    build:
      targets:
        Tornadobreak: all
    test:
      gatherCoverageData: false
      targets:
        - TornadobreakTests
        - TornadobreakUITests
